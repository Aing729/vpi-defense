<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VPI Camera</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 10px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
    }
    #container { text-align: center; }
    #video {
        max-width: 100%; max-height: 280px;
        width: auto; height: auto;
        border-radius: 8px; background: #000;
        display: block; margin: 0 auto;
    }
    .controls {
        margin-top: 10px;
        display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    button {
        padding: 10px 18px; font-size: 1em;
        border: none; border-radius: 6px;
        cursor: pointer; font-weight: 500;
        transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #btn-switch { background: #4a90e2; color: white; }
    #btn-capture { background: #28a745; color: white; }
    #status {
        margin-top: 10px; font-size: 0.95em; color: #555;
        min-height: 20px;
    }
</style>
</head>
<body>
<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <div class="controls">
        <button id="btn-switch">🔄 전환</button>
        <button id="btn-capture">📸 촬영</button>
    </div>
    <div id="status">카메라 초기화 중...</div>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
// ============================================================================
// Streamlit 공식 통신 프로토콜
// ============================================================================
function sendToStreamlit(type, extra) {
    const msg = { isStreamlitMessage: true, type: type };
    if (extra) Object.assign(msg, extra);
    window.parent.postMessage(msg, "*");
}

function setComponentReady() {
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
}

function setFrameHeight(height) {
    sendToStreamlit("streamlit:setFrameHeight", { height: height });
}

function setComponentValue(value) {
    sendToStreamlit("streamlit:setComponentValue", {
        value: value,
        dataType: "json"
    });
}

// ============================================================================
// 카메라 로직
// ============================================================================
let facing = 'environment';
let currentStream = null;

async function startCamera() {
    try {
        if (currentStream) {
            currentStream.getTracks().forEach(t => t.stop());
        }
        currentStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facing } },
            audio: false
        });
        document.getElementById('video').srcObject = currentStream;
        document.getElementById('status').innerText =
            facing === 'environment' ? '📷 후면 카메라' : '🤳 전면 카메라';
    } catch(e) {
        document.getElementById('status').innerText = '❌ 카메라 접근 실패: ' + e.message;
    }
}

document.getElementById('btn-switch').addEventListener('click', function() {
    facing = facing === 'environment' ? 'user' : 'environment';
    startCamera();
});

document.getElementById('btn-capture').addEventListener('click', function() {
    const video = document.getElementById('video');
    if (!video.videoWidth) {
        document.getElementById('status').innerText = '⏳ 카메라가 아직 준비 중입니다.';
        return;
    }
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const dataURL = canvas.toDataURL('image/jpeg', 0.85);

    document.getElementById('status').innerText = '✅ 촬영됨! 분석을 시작하세요.';

    // Streamlit Python에 base64 데이터 전달 (공식 API)
    setComponentValue(dataURL);
});

// ============================================================================
// 초기화
// ============================================================================
// 1. Streamlit에 준비 완료 알림
setComponentReady();
// 2. iframe 높이 설정
setFrameHeight(400);
// 3. 카메라 자동 시작
startCamera();
</script>
</body>
</html>
